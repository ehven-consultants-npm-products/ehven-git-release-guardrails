name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Verify portable guards
          - os: macos-26
            check: Verify CLI on macOS
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Select OpenSSL for the local TLS fixture
        if: runner.os == 'macOS'
        shell: bash
        run: printf '%s\n' "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Record tool versions
        run: |
          node --version
          git --version
          openssl version
      # No install: this development candidate has no npm dependencies.
      - run: npm test
  required:
    name: Required checks
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require portable checks
        env:
          VERIFY: ${{ needs.verify.result }}
        run: test "$VERIFY" = success
